aid: sail
name: Sail
description: >-
  Sail Research provides cloud infrastructure for running long-horizon AI agents
  efficiently. Its inference platform serves leading open-source models (GLM,
  Kimi, DeepSeek, gpt-oss, Gemma, and more) through an OpenAI-compatible
  Responses and Chat Completions API plus an Anthropic-compatible Messages API,
  so existing SDKs work as drop-in clients. "Completion windows" (asap, priority,
  standard, flex) trade latency for 30-80% token savings, and a Batch API
  processes up to 100,000 requests asynchronously. Sailboxes add persistent
  virtual-machine compute for agents that need to run indefinitely, with
  checkpoint/resume, networking, and a native CLI. The platform supports LoRA
  fine-tunes, Tinker RL rollouts, prompt caching, completion webhooks, and
  usage/observability (Voyages) for background agents.
